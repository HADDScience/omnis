# pnpm 은 의존성의 설치 스크립트를 기본으로 막는다. 여기 적은 것만 돌린다.
# prisma·@prisma/* 는 엔진 바이너리를, sharp·esbuild·unrs-resolver 는 네이티브 모듈을
# 설치 중에 받아 온다 — 빠지면 빌드가 깨진다.
# @swc/core · cbor-extract(workflow 가 끌어온다)는 플랫폼별 미리 빌드한 패키지가 함께 깔려
# 스크립트가 할 일이 없다(postinstall 은 바이너리 확인, install 은 없을 때만 node-gyp) — 막아 둔다.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': false
  cbor-extract: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
