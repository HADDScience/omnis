name: Release Drafter

# 다음 버전 릴리스 노트 초안을 쌓는다 — 설정은 .github/release-drafter.yml.
# - main 에 푸시(= PR 머지 = 운영 배포)될 때마다 초안을 고쳐 쓴다. 공개(publish)는 하지 않는다.
# - PR 을 열거나 제목을 고치면 제목 접두사로 라벨(feature · fix · perf · test …)을 붙인다.
# job 이름은 브랜치 보호의 필수 검사(verify · e2e)와 겹치지 않게 둔다.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: release-draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          # PR 에서는 라벨만 붙이고 초안은 main 푸시 때만 고친다
          disable-releaser: ${{ github.event_name == 'pull_request' }}
          disable-autolabeler: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
