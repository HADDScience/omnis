name: Build and Publish Docker Image

# 수동 실행만 받는다(2026-10-07). 운영은 Vercel 이고 이 이미지를 쓰는 곳은 NAS 자체 호스팅용
# docker-compose.synology.yml 뿐인데, 지금 그 구성은 돌지 않는다. main 푸시마다 빌드하던 것은
# 9/21 pnpm 전환 뒤로 매번 실패했다 — Dockerfile 의 `node_modules/.bin/esbuild` 가 없다
# (pnpm 은 직접 선언한 패키지만 .bin 에 올린다). 다시 쓸 때는 esbuild 를 devDependency 로
# 넣고 돌린다.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
