# Synology Container Manager 전용 Compose 파일.
# 사전 빌드된 GHCR 이미지(ghcr.io/haddscience/omnis)를 pull해서 실행.
# 환경변수는 같은 폴더의 .env 파일(또는 Container Manager UI)로 주입.
#
# ── 공동 사용 NAS 안전장치 ──────────────────────────────
# 이 스택은 NAS를 함께 쓰는 다른 서비스에 영향을 주지 않도록 다음을 보장한다.
#  1) DB는 포트를 열지 않는다 → 외부에서 직접 접근 불가, 앱 컨테이너만 접속.
#  2) 전용 네트워크(omnis_net)를 사용한다 → 다른 컨테이너와 통신하지 않음.
#  3) CPU/메모리 상한을 명시한다 → NAS 자원을 무제한으로 점유하지 않음.
#  4) 공개 포트는 .env의 OMNIS_PORT 하나뿐 → 충돌 시 그 값만 바꾸면 된다.

services:
  omnis-db:
    image: pgvector/pgvector:pg16
    container_name: omnis-db
    restart: unless-stopped
    # 포트를 노출하지 않는다. omnis 앱 컨테이너만 내부 네트워크로 접속한다.
    environment:
      POSTGRES_DB: omnis
      POSTGRES_USER: omnis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - omnis_pgdata:/var/lib/postgresql/data
    networks:
      - omnis_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnis"]
      interval: 5s
      timeout: 5s
      retries: 10

  omnis:
    image: ghcr.io/haddscience/omnis:latest
    container_name: omnis
    restart: unless-stopped
    ports:
      # 왼쪽(NAS에서 열리는 포트)만 .env의 OMNIS_PORT로 조정한다.
      # 3000번이 이미 사용 중이면 .env에서 OMNIS_PORT=3100 등으로 변경.
      - "${OMNIS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://omnis:${POSTGRES_PASSWORD}@omnis-db:5432/omnis
      POSTGRES_URL_NON_POOLING: postgresql://omnis:${POSTGRES_PASSWORD}@omnis-db:5432/omnis
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEED_PASSWORD: ${SEED_PASSWORD:-hadd1234}
    volumes:
      # 채팅·업무에 첨부한 파일 보관소.
      # 이 볼륨이 없으면 컨테이너를 다시 만들 때마다 첨부파일이 전부 사라진다.
      - omnis_uploads:/app/public/uploads
    networks:
      - omnis_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    depends_on:
      omnis-db:
        condition: service_healthy

networks:
  omnis_net:
    driver: bridge

volumes:
  omnis_pgdata:
  omnis_uploads:
